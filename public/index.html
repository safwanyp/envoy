<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Envoy</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand-block">
        <h1 class="brand">Envoy</h1>
        <p class="tagline">Many agents, one main branch.</p>
      </div>
      <div class="controls">
        <p id="demo-status" class="demo-status" role="status" aria-live="polite"></p>
        <button type="button" id="run-demo" class="run-demo">Run demo</button>
      </div>
    </header>

    <main class="panels">
      <section class="panel" aria-labelledby="radar-heading">
        <header class="panel-head">
          <h2 id="radar-heading">Radar</h2>
          <p class="panel-note">Claimed symbols</p>
        </header>
        <div id="radar" class="panel-body" data-empty="No active claims yet."></div>
      </section>
      <section class="panel" aria-labelledby="timeline-heading">
        <header class="panel-head">
          <h2 id="timeline-heading">Main timeline</h2>
          <p class="panel-note">Commits on main</p>
        </header>
        <div id="timeline" class="panel-body" data-empty="No commits on main yet."></div>
      </section>
      <section class="panel" aria-labelledby="lineage-heading">
        <header class="panel-head">
          <h2 id="lineage-heading">Lineage</h2>
          <p class="panel-note">Attempts per task</p>
        </header>
        <div id="lineage" class="panel-body" data-empty="No attempt chains yet."></div>
      </section>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
